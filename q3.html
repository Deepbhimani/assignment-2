<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign in</title>
</head>

<body>
    <form>
        <H1>Regestration Form</H1>
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="name" placeholder="Enter Name">
        </div>
        <div>
            <label for="phone">Phone Number</label><br>
            <input type="phone" id="phone" placeholder="Mobile Number">
        </div>
        <div>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" placeholder="E-mail">
        </div>

        <div>
            <label for="Password">Password</label><br>
            <input type="password" id="Password" placeholder="password">
        </div>
        <div>
            <p>Gender</p>
            <input type="radio" name="gender" id="Male">
            <label for="Male">Male</label><br>

            <input type="radio" name="gender" id="Female">
            <label for="Female">Female</label><br>
        </div><br>
        <div>
            Select your class 
        <br>

        <label for="101">
            <input type="radio" value="Class X" name="class"id="101">Class X
        </label>
        <br>

        <label for="102">
            <input type="radio" value="Class XII" name="class"id="102">Class XII
        </label>
        <br>

        Select your favourite subjects 
        <br>

        <label for="math">
            <input type="checkbox" value="math" name="subjects" id="103">Math
        </label>
        <br>

        <label for="phy">
            <input type="checkbox" value="phy" name="subjects" id="103">Physics
        </label>
        <br>
 
        <label for="chemistry">
            <input type="checkbox" value="chemistry" name="subjects" id="103">Chemistry
        </label>
        <br>
 
        <label for="English">
            <input type="checkbox" value="English" name="subjects" id="103">English
        </label>
        <br><br>

        <select name="city" >
            <option value="surat">surat</option>
            <option value="ahemdabad">ahemdabad</option>
            <option value="delhi">delhi</option>
            <option value="mumbai">mumbai</option>
        </select>
        
        </div><br>
        <button>Reset</button>
        <button>Submit</button>

    </form>
</body>

</html>
